name: Build BiteIQ images
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/k8s/**', 'deploy/flux/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: biteiq-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: EXPO_PUBLIC_API_URL=https://biteiq.jericoagustin.com/api
          labels: org.opencontainers.image.source=https://github.com/agustinkiko/BiteIQ
          tags: ghcr.io/agustinkiko/biteiq-${{ matrix.name }}:main-${{ github.sha }}-${{ github.run_number }}
