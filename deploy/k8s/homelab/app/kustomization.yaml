apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: biteiq
resources:
  - ../../example
  - cloudflare-ingress.yaml
images:
  - name: ghcr.io/example/biteiq-api
    newName: ghcr.io/agustinkiko/biteiq-api
    newTag: main-589fa8718294735aedc134308206b4aad57d5fe0-4
  - name: ghcr.io/example/biteiq-web
    newName: ghcr.io/agustinkiko/biteiq-web
    newTag: main-589fa8718294735aedc134308206b4aad57d5fe0-4
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: biteiq
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: biteiq-api-config
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: biteiq-postgres
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: biteiq-postgres
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: biteiq-migrate
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: biteiq-api
  - target:
      kind: Ingress
      name: biteiq-api-http-redirect
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: biteiq.jericoagustin.com
