apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: biteiq
resources:
  - ../../example
images:
  - name: ghcr.io/example/biteiq-api
    newName: ghcr.io/agustinkiko/biteiq-api
    newTag: main-a7dcd3357930f7a3622dbed6aedfd6af3a65d7ac-2
  - name: ghcr.io/example/biteiq-web
    newName: ghcr.io/agustinkiko/biteiq-web
    newTag: main-a7dcd3357930f7a3622dbed6aedfd6af3a65d7ac-2
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: biteiq
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: biteiq-api-config
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: biteiq-postgres
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: biteiq-postgres
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: biteiq-migrate
  - target:
      kind: Ingress
      name: biteiq-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: biteiq.jericoagustin.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: biteiq.jericoagustin.com
      - op: replace
        path: /spec/tls/0/secretName
        value: biteiq-tls
  - target:
      kind: Ingress
      name: biteiq-api-http-redirect
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: biteiq.jericoagustin.com
