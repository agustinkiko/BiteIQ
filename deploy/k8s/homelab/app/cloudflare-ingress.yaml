# Cloudflare terminates public TLS; its encrypted tunnel reaches this HTTP origin.
# Only HTTPS visitors use these routes. Plain HTTP keeps the existing redirect.
# CF-Visitor is supplied by Cloudflare, not used as an authentication boundary.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: biteiq-cloudflare
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: >-
        Host(`biteiq.jericoagustin.com`) &&
        HeaderRegexp(`CF-Visitor`, `^\{\s*"scheme"\s*:\s*"https"\s*\}$`) &&
        (Path(`/api`) || PathPrefix(`/api/`))
      priority: 200
      services:
        - name: biteiq-api
          port: http
    - kind: Rule
      match: >-
        Host(`biteiq.jericoagustin.com`) &&
        HeaderRegexp(`CF-Visitor`, `^\{\s*"scheme"\s*:\s*"https"\s*\}$`)
      priority: 100
      services:
        - name: biteiq-web
          port: http
