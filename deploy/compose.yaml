services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biteiq
      POSTGRES_USER: biteiq
      POSTGRES_PASSWORD: biteiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biteiq -d biteiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - biteiq-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"

  api:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "npm ci && npm run dev"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://biteiq:biteiq@postgres:5432/biteiq
      AUTH_SECRET: ${AUTH_SECRET:-biteiq-local-development-secret-change-me}
      APP_URL: ${APP_URL:-http://127.0.0.1:4000}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ../:/app
      - biteiq-api-node-modules:/app/server/node_modules

volumes:
  biteiq-postgres-data:
  biteiq-api-node-modules:
